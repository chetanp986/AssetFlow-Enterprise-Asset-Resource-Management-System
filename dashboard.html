<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetFlow | Dashboard</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="navbar-container"></div>

        <div class="page-header">
            <h1>Dashboard</h1>
            <p>Welcome back, <span id="user-greeting">Loading...</span></p>
        </div>

        <section class="kpi-grid">
            <div class="kpi-card">
                <h3>Total Assets</h3>
                <p class="kpi-value" id="kpi-total">--</p>
            </div>
            <div class="kpi-card status-active">
                <h3>In Use</h3>
                <p class="kpi-value" id="kpi-in-use">--</p>
            </div>
            <div class="kpi-card status-maintenance">
                <h3>Maintenance</h3>
                <p class="kpi-value" id="kpi-maintenance">--</p>
            </div>
            <div class="kpi-card status-danger">
                <h3>Overdue</h3>
                <p class="kpi-value" id="kpi-overdue">--</p>
            </div>
        </section>

        <div class="dashboard-split">
            <section class="alerts-section">
                <h2>Requires Attention</h2>
                <div class="table-container">
                    <table id="overdue-table">
                        <thead>
                            <tr>
                                <th>Asset Tag</th>
                                <th>Assigned To</th>
                                <th>Due Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="overdue-tbody">
                            <tr><td colspan="4">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="quick-actions">
                <h2>Quick Actions</h2>
                <div class="action-buttons">
                    <button class="btn-action" onclick="window.location.href='assets.html?action=new'">➕ Register Asset</button>
                    <button class="btn-action" onclick="window.location.href='allocations.html'">🔄 Assign Asset</button>
                    <button class="btn-action" onclick="window.location.href='maintenance.html?action=report'">🛠️ Report Issue</button>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="js/core/app.js"></script>
    <script type="module" src="js/core/rbac.js"></script>
    <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
