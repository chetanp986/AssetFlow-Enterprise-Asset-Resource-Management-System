<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetFlow | Maintenance</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/maintenance.css">
</head>
<body class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="navbar-container"></div>

        <div class="page-header">
            <h1>Maintenance & Repairs</h1>
            <p>Report damaged assets and track repair progress.</p>
        </div>

        <div class="maintenance-grid">
            <section class="action-panel">
                <h2>Report an Issue</h2>
                <form id="form-maintenance">
                    <div class="input-group">
                        <label for="select-asset">Select Asset</label>
                        <select id="select-asset" required>
                            <option value="">Loading assets...</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="issue-priority">Priority</label>
                        <select id="issue-priority" required>
                            <option value="Low">Low - Cosmetic/Minor</option>
                            <option value="Medium" selected>Medium - Usable but degraded</option>
                            <option value="High">High - Completely broken/Unsafe</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="issue-desc">Issue Description</label>
                        <textarea id="issue-desc" rows="4" required placeholder="Describe what is wrong..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary w-100">Submit Ticket</button>
                </form>
            </section>

            <section class="tickets-panel">
                <h2>Active Maintenance Tickets</h2>
                <div id="tickets-container" class="tickets-container">
                    <div class="empty-state">Loading tickets...</div>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="js/core/app.js"></script>
    <script type="module" src="js/core/rbac.js"></script>
    <script type="module" src="js/pages/maintenance.js"></script>
</body>
</html>
