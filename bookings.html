<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetFlow | Resource Bookings</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/bookings.css">
</head>
<body class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="navbar-container"></div>

        <div class="page-header">
            <h1>Resource Bookings</h1>
            <p>Reserve shared assets like conference rooms, vehicles, or projectors.</p>
        </div>

        <div class="booking-grid">
            <section class="booking-panel">
                <h2>New Reservation</h2>
                <form id="form-booking">
                    <div class="input-group">
                        <label for="select-resource">Select Resource</label>
                        <select id="select-resource" required>
                            <option value="">Loading resources...</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="booking-date">Date</label>
                        <input type="date" id="booking-date" required>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="start-time">Start Time</label>
                            <input type="time" id="start-time" required>
                        </div>
                        <div class="input-group">
                            <label for="end-time">End Time</label>
                            <input type="time" id="end-time" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="booking-purpose">Purpose (Optional)</label>
                        <input type="text" id="booking-purpose" placeholder="e.g., Client Meeting">
                    </div>

                    <div id="conflict-error" class="error-text" style="display: none;">
                        ⚠️ Time slot unavailable. This resource is already booked.
                    </div>

                    <button type="submit" class="btn-primary w-100" id="btn-submit">Confirm Booking</button>
                </form>
            </section>

            <section class="schedule-panel">
                <div class="schedule-header">
                    <h2>Daily Schedule</h2>
                    <span id="schedule-date-display" class="date-badge">Select a date</span>
                </div>
                
                <div id="timeline-container" class="timeline">
                    <div class="empty-state">Select a resource and date to view availability.</div>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="js/core/app.js"></script>
    <script type="module" src="js/core/rbac.js"></script>
    <script type="module" src="js/pages/bookings.js"></script>
</body>
</html>
