<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AssetFlow 10-Day Data Injector</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f6f9; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; max-width: 500px; }
        button { background: #0056b3; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7CAxk7ynY11lZr6jd-kqxbrNxTWLtJ7o",
            authDomain: "assetflow-enterprise-system.firebaseapp.com",
            projectId: "assetflow-enterprise-system",
            storageBucket: "assetflow-enterprise-system.appspot.com",
            messagingSenderId: "338905391166",
            appId: "1:338905391166:web:8de488f553ab1ee45de4fa"
        };

        const db = getFirestore(initializeApp(firebaseConfig));

        const bulkAssets = [
            { name: "MacBook Pro 16", category: "Laptops", department: "Engineering", status: "Allocated", assetTag: "LAP-26-1001", dueDate: "2026-07-20" },
            { name: "HP EliteDisplay", category: "Peripherals", department: "Admin", status: "Available", assetTag: "PER-26-2002" },
            { name: "Logitech MX Master 3", category: "Peripherals", department: "Design", status: "Allocated", assetTag: "PER-26-2003", dueDate: "2026-07-10" },
            { name: "Samsung Galaxy Tab", category: "Tablets", department: "Sales", status: "Available", assetTag: "TAB-26-3004" },
            { name: "Workstation Dell", category: "Workstations", department: "Engineering", status: "Maintenance", assetTag: "WRK-26-4005" },
            { name: "Office Chair Ergonomic", category: "Furniture", department: "Admin", status: "Available", assetTag: "FUR-26-5006" },
            { name: "Cisco Catalyst Switch", category: "Servers / Networking", department: "IT", status: "Available", assetTag: "SRV-26-6007" },
            { name: "Canon Pixma Printer", category: "Peripherals", department: "Admin", status: "Available", assetTag: "PER-26-2008" },
            { name: "iPhone 15 Pro", category: "Mobile", department: "Sales", status: "Allocated", assetTag: "MOB-26-7009", dueDate: "2026-07-15" },
            { name: "Whiteboard Interactive", category: "Furniture", department: "Engineering", status: "Available", assetTag: "FUR-26-5010" }
        ];

        async function injectData() {
            document.getElementById("status").innerText = "Uploading 10 days of activity...";
            try {
                for (const asset of bulkAssets) {
                    await addDoc(collection(db, "assets"), {
                        ...asset,
                        createdAt: new Date().toISOString()
                    });
                }
                document.getElementById("status").innerText = "✅ Successfully injected 10-day dataset!";
            } catch (e) {
                document.getElementById("status").innerText = "❌ Error: " + e.message;
            }
        }
        window.injectData = injectData;
    </script>
</head>
<body>
    <div class="card">
        <h2>Bulk Data Generator</h2>
        <button onclick="injectData()">Inject 10-Day Dataset</button>
        <div id="status"></div>
    </div>
</body>
</html>
