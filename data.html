<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Fleet 10-Day Data Injector</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #f4f6f9; }
        .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: inline-block; max-width: 500px; }
        button { background: #0056b3; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; transition: background 0.3s; }
        button:hover { background: #004494; }
        #status { margin-top: 20px; font-weight: bold; color: #333; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ REPLACE THIS WITH YOUR FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "your-project-id.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project-id.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const db = getFirestore(initializeApp(firebaseConfig));

        // 10-Day Car Booking Dataset
        const bulkBookings = [
            { date: "2026-07-01", bookingId: "BKG-7001", customerName: "Alice Chen", vehicle: "Tesla Model 3", serviceType: "Airport Transfer", amount: 65.00, status: "Completed" },
            { date: "2026-07-02", bookingId: "BKG-7002", customerName: "Marcus Johnson", vehicle: "Toyota Camry", serviceType: "Daily Rental", amount: 45.00, status: "Completed" },
            { date: "2026-07-03", bookingId: "BKG-7003", customerName: "Sarah Jenkins", vehicle: "Ford Transit", serviceType: "Group Tour", amount: 120.00, status: "Completed" },
            { date: "2026-07-04", bookingId: "BKG-7004", customerName: "David Lee", vehicle: "Honda CR-V", serviceType: "Hourly Booking", amount: 35.00, status: "Canceled" },
            { date: "2026-07-05", bookingId: "BKG-7005", customerName: "Emily Davis", vehicle: "BMW 5 Series", serviceType: "Executive Chauffeur", amount: 150.00, status: "Completed" },
            { date: "2026-07-06", bookingId: "BKG-7006", customerName: "Michael Brown", vehicle: "Hyundai Tucson", serviceType: "Daily Rental", amount: 50.00, status: "Completed" },
            { date: "2026-07-07", bookingId: "BKG-7007", customerName: "Jessica Wilson", vehicle: "Tesla Model Y", serviceType: "Airport Transfer", amount: 75.00, status: "Completed" },
            { date: "2026-07-08", bookingId: "BKG-7008", customerName: "Robert Taylor", vehicle: "Chevrolet Malibu", serviceType: "Hourly Booking", amount: 25.00, status: "Completed" },
            { date: "2026-07-09", bookingId: "BKG-7009", customerName: "Laura Martinez", vehicle: "Mercedes-Benz S-Class", serviceType: "Executive Chauffeur", amount: 180.00, status: "Active" },
            { date: "2026-07-10", bookingId: "BKG-7010", customerName: "James Anderson", vehicle: "Toyota RAV4", serviceType: "Daily Rental", amount: 55.00, status: "Scheduled" }
        ];

        async function injectData() {
            const statusEl = document.getElementById("status");
            statusEl.innerText = "Uploading 10 days of bookings...";
            statusEl.style.color = "#0056b3";

            try {
                // Using a Batch Write for faster, safer bulk injection
                const batch = writeBatch(db);
                const bookingsCollection = collection(db, "bookings");

                for (const booking of bulkBookings) {
                    const docRef = doc(bookingsCollection); // Auto-generates a document ID
                    batch.set(docRef, {
                        ...booking,
                        createdAt: new Date().toISOString()
                    });
                }

                // Commit all 10 records to the database at once
                await batch.commit(); 
                
                statusEl.innerText = "✅ Successfully injected 10-day dataset!";
                statusEl.style.color = "green";
            } catch (e) {
                statusEl.innerText = "❌ Error: " + e.message;
                statusEl.style.color = "red";
                console.error("Injection Error:", e);
            }
        }
        
        // Attach function to the window object so the HTML button can trigger it
        window.injectData = injectData;
    </script>
</head>
<body>
    <div class="card">
        <h2>Car Fleet Bulk Data Generator</h2>
        <p style="color: #666; margin-bottom: 25px;">Click below to populate your Firestore database with 10 dummy bookings.</p>
        <button onclick="injectData()">Inject 10-Day Dataset</button>
        <div id="status"></div>
    </div>
</body>
</html>
