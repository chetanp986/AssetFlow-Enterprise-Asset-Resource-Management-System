<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetFlow | Allocations</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/allocations.css">
</head>
<body class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="navbar-container"></div>

        <div class="page-header">
            <h1>Asset Allocations</h1>
            <p>Assign available assets to employees and track returns.</p>
        </div>

        <div class="allocation-grid">
            <section class="action-panel">
                <h2>Assign an Asset</h2>
                <form id="form-allocate">
                    <div class="input-group">
                        <label for="select-asset">Available Assets</label>
                        <select id="select-asset" required>
                            <option value="">Loading available assets...</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="select-user">Assignee</label>
                        <select id="select-user" required>
                            <option value="">Loading employees...</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="input-group">
                            <label for="checkout-date">Checkout Date</label>
                            <input type="date" id="checkout-date" required>
                        </div>
                        <div class="input-group">
                            <label for="due-date">Expected Return</label>
                            <input type="date" id="due-date" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary w-100">Allocate Asset</button>
                </form>
            </section>

            <section class="table-panel">
                <h2>Currently Checked Out</h2>
                <div class="table-container">
                    <table id="allocations-table">
                        <thead>
                            <tr>
                                <th>Asset Tag / Name</th>
                                <th>Assigned To</th>
                                <th>Due Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="allocations-tbody">
                            <tr><td colspan="4">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="js/core/app.js"></script>
    <script type="module" src="js/core/rbac.js"></script>
    <script type="module" src="js/pages/allocations.js"></script>
</body>
</html>
