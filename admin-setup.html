<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetFlow | Admin Setup</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="navbar-container"></div>

        <div class="page-header">
            <h1>Organization Setup</h1>
            <p>Manage system categories, departments, and user roles.</p>
        </div>

        <div class="admin-grid">
            <section class="admin-panel">
                <h2>Asset Categories</h2>
                <form id="form-category" class="admin-form">
                    <input type="text" id="new-category" placeholder="e.g., Laptops" required>
                    <button type="submit" class="btn-primary-small">Add</button>
                </form>
                <ul id="list-categories" class="data-list">
                    <li>Loading...</li>
                </ul>
            </section>

            <section class="admin-panel">
                <h2>Departments</h2>
                <form id="form-department" class="admin-form">
                    <input type="text" id="new-department" placeholder="e.g., Engineering" required>
                    <button type="submit" class="btn-primary-small">Add</button>
                </form>
                <ul id="list-departments" class="data-list">
                    <li>Loading...</li>
                </ul>
            </section>

            <section class="admin-panel full-width">
                <h2>User Management</h2>
                <div class="table-container">
                    <table id="users-table">
                        <thead>
                            <tr>
                                <th>Name / Email</th>
                                <th>Current Role</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="users-tbody">
                            <tr><td colspan="3">Loading users...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script type="module" src="js/core/app.js"></script>
    <script type="module" src="js/core/rbac.js"></script> <script type="module" src="js/pages/admin-setup.js"></script>
</body>
</html>
