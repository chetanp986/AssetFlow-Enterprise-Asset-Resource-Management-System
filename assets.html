<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetFlow | Asset Directory</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/assets.css">
</head>
<body class="app-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div id="navbar-container"></div>

        <div class="page-header flex-between">
            <div>
                <h1>Asset Directory</h1>
                <p>Manage and track all company assets.</p>
            </div>
            <button id="btn-open-modal" class="btn-primary">➕ Register Asset</button>
        </div>

        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Search by name or tag...">
            <select id="filter-status">
                <option value="">All Statuses</option>
                <option value="Available">Available</option>
                <option value="Allocated">Allocated</option>
                <option value="Maintenance">Maintenance</option>
            </select>
        </div>

        <div class="table-container">
            <table id="assets-table">
                <thead>
                    <tr>
                        <th>Asset Tag</th>
                        <th>Model / Name</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Department</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="assets-tbody">
                    <tr><td colspan="6">Loading assets...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="asset-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Register New Asset</h2>
                <button id="btn-close-modal" class="close-btn">&times;</button>
            </div>
            <form id="form-register-asset">
                <div class="input-group">
                    <label>Asset Name / Model</label>
                    <input type="text" id="asset-name" required placeholder="e.g., MacBook Pro M2">
                </div>
                
                <div class="form-row">
                    <div class="input-group">
                        <label>Category</label>
                        <select id="asset-category" required>
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Default Department</label>
                        <select id="asset-department" required>
                            <option value="">Loading...</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Serial Number (Optional)</label>
                    <input type="text" id="asset-serial" placeholder="SN-XXXXXXX">
                </div>

                <div class="modal-footer">
                    <button type="button" id="btn-cancel-modal" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Register Asset</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/core/app.js"></script>
    <script type="module" src="js/core/rbac.js"></script>
    <script type="module" src="js/pages/assets.js"></script>
</body>
</html>
