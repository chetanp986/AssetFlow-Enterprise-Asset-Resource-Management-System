<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AssetFlow | Login</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-header">
            <h2>Welcome to AssetFlow</h2>
            <p id="auth-subtitle">Log in to manage your workspace.</p>
        </div>

        <form id="auth-form">
            <div class="input-group" id="name-group" style="display: none;">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Jane Doe">
            </div>

            <div class="input-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" required placeholder="name@company.com">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div id="error-message" class="error-text"></div>

            <button type="submit" id="submit-btn" class="btn-primary">Log In</button>
        </form>

        <div class="auth-footer">
            <p id="toggle-text">Need an account? <button type="button" id="toggle-btn" class="btn-link">Sign Up</button></p>
        </div>
    </div>

    <script type="module" src="js/core/auth.js"></script>
</body>
</html>
