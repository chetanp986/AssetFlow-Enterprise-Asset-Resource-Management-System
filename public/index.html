<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AssetFlow Firebase App</title>
    <style>
      body { background: #eef2ff; color: #111827; font-family: Inter, system-ui, sans-serif; margin: 0; }
      .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; }
      .card { width: min(100%, 800px); background: #fff; border-radius: 24px; box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12); padding: 32px; }
      h1 { margin-top: 0; font-size: clamp(2rem, 3vw, 3rem); }
      p { margin: 0 0 20px; color: #4b5563; line-height: 1.7; }
      code { background: #f3f4f6; padding: 4px 8px; border-radius: 8px; font-size: 0.95em; }
      #status { font-weight: 700; color: #2563eb; }
      button { margin-top: 20px; padding: 14px 22px; border: none; border-radius: 14px; background: #2563eb; color: white; font-size: 1rem; cursor: pointer; }
      button:disabled { opacity: 0.55; cursor: default; }
      #log { margin-top: 20px; white-space: pre-wrap; color: #374151; font-size: 0.95rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>AssetFlow Firebase App</h1>
        <p>Paste your Firebase web app config into <code>public/firebase-config.js</code> and refresh this page. This demo connects Firebase Auth anonymously so you can verify the setup quickly.</p>
        <p>Status: <span id="status">Loading...</span></p>
        <button id="login-btn" disabled>Sign in anonymously</button>
        <div id="log"></div>
      </section>
    </main>

    <script type="module" src="/firebase-config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
